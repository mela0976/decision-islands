<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e9e5d9">
  <title>2026 決策智慧｜3D 沉浸式互動群島</title>
  <link rel="stylesheet" href="../fonts/publication.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./contrast.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <canvas id="world" aria-label="可旋轉、縮放與點選的文章群島"></canvas>
  <header><a class="brand" href="./">dentsu<span>DECISION INTELLIGENCE / 2026</span></a><button id="map-toggle" aria-expanded="false">22 座島・目錄</button><button id="mode">故事探索</button><button id="settings-toggle">設定</button></header>
  <p id="status" role="status" aria-live="polite">正在展開群島。你也可以先閱讀文章。</p>
  <nav id="travel-controls" aria-label="航行操作" hidden><button id="skip-travel">略過航行</button><button id="return-travel">返回上一座島</button></nav>
  <aside id="catalog" hidden><h1>航向下一個問題</h1><label>搜尋原文<input id="search" type="search" placeholder="文章、作者或關鍵字"></label><label><input id="only-bookmarks" type="checkbox">只看收藏</label><p id="progress"></p><div id="article-list"></div><button id="export-progress">下載閱讀紀錄與筆記</button><label class="import-label">匯入備份<input id="import-progress" type="file" accept="application/json"></label></aside>
  <aside id="settings" hidden><h2>探索設定</h2><label>島上人數 <output id="population-value">30</output><input id="population" type="range" min="10" max="100" step="1" value="30"></label><label><input id="motion" type="checkbox">減少動態效果</label><label><input id="sound" type="checkbox">環境音效</label><label>節慶<select id="season"><option value="christmas">聖誕節</option><option value="halloween">萬聖節</option><option value="easter">復活節</option></select></label><p>拖曳旋轉、雙指或滾輪縮放。點人物與場景道具開始互動。</p></aside>
  <section id="story" aria-label="島嶼故事"><p id="chapter-label"></p><h1 id="island-title">2026 決策智慧</h1><p id="dialogue">答案很多，可是我到底該相信哪一個？</p><div class="actions"><button id="interact">走進情境</button><button id="read">閱讀原文</button><button id="bookmark">收藏</button></div><nav><button id="previous">← 上一座</button><button id="overview">全景</button><button id="next">下一座 →</button></nav></section>
  <dialog id="reader" aria-labelledby="reader-title"><form method="dialog"><button class="close" aria-label="關閉閱讀">✕</button></form><p class="eyebrow">READ / REFLECT / RETURN</p><h1 id="reader-title"></h1><p id="byline"></p><div class="tabs" role="group" aria-label="閱讀深度"><button data-depth="guide">30 秒導讀</button><button data-depth="summary">3 分鐘重點</button><button data-depth="full">完整原文</button></div><article id="reading-content"></article><a id="source" target="_blank" rel="noopener">對照原刊 PDF ↗</a><p><button id="mark-read">標記讀完</button></p><label>我的筆記<textarea id="note" maxlength="8000" rows="4" placeholder="留下想法，下次回來接續。"></textarea></label><p id="note-status" role="status">僅儲存在這個瀏覽器</p><section id="recommendations"></section></dialog>
  <dialog id="game" aria-labelledby="game-title"><form method="dialog"><button class="close" aria-label="關閉情境">✕</button></form><p class="eyebrow">虛構情境演繹・觀點來自原刊</p><h2 id="game-title"></h2><p id="game-intro"></p><div id="game-controls"></div><div id="game-visual" aria-hidden="true"></div><p id="game-result" role="status" aria-live="polite"></p><div id="game-after" hidden><button id="compare">查看選擇前</button><button id="replay">重玩</button><button id="game-read">看這篇觀點</button></div></dialog>
  <section id="intro" hidden><div id="intro-book"><img src="../assets/cover-2026.webp" alt="電通 2026 決策智慧原刊封面"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><p id="intro-caption">翻開一頁，走進一個問題。</p><button id="skip-intro">略過，進入群島</button></section>
  <noscript><p>JavaScript 未啟用，可直接<a href="../read/2026/index.html">閱讀全部 22 篇原文</a>。</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
